name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - name: Restore previous dist
        uses: actions/cache/restore@v4
        with:
          path: dist-prev
          key: dist-artifacts-${{ runner.os }}
      - run: npm run build -- --base=/Finance-Analyzer/
      # Keep hashed assets from previous deploys: cached index.html
      # files keep loading their own assets until the Pages CDN cache
      # (max-age=600) expires, so visitors never hit a blank 404 window.
      - name: Keep previous assets
        shell: bash
        run: |
          if [ -d dist-prev/assets ]; then
            cp -rn dist-prev/assets/* dist/assets/ || true
          fi
      - name: Store dist for next run
        uses: actions/cache/save@v4
        with:
          path: dist
          key: dist-artifacts-${{ runner.os }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4